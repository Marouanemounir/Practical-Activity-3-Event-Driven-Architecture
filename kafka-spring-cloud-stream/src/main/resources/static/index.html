<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Analytics Temps Réel</title>
    <link rel="icon" href="data:,">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/smoothie/1.34.0/smoothie.min.js"></script>
    <style>
        :root {
            color-scheme: light;
            --page: #f3f3f1;
            --surface: #fcfcfb;
            --border: #e2e1dc;
            --grid: #ecebe7;
            --text-primary: #0b0b0b;
            --text-secondary: #52514e;
            --series-1: #2a78d6;
            --series-2: #eb6834;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                color-scheme: dark;
                --page: #111110;
                --surface: #1a1a19;
                --border: #33332f;
                --grid: #2a2a27;
                --text-primary: #f0efec;
                --text-secondary: #c3c2b7;
                --series-1: #3987e5;
                --series-2: #d95926;
            }
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --page: #111110;
            --surface: #1a1a19;
            --border: #33332f;
            --grid: #2a2a27;
            --text-primary: #f0efec;
            --text-secondary: #c3c2b7;
            --series-1: #3987e5;
            --series-2: #d95926;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--page);
            color: var(--text-primary);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            line-height: 1.45;
        }

        main {
            width: min(1040px, 100%);
            margin: 0 auto;
            padding: 32px 16px;
        }

        header {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 24px;
        }

        h1 { margin: 0; font-size: 26px; line-height: 1.2; }
        h2 { margin: 0; font-size: 16px; }
        p { margin: 4px 0 0; color: var(--text-secondary); font-size: 14px; }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface);
            color: var(--text-secondary);
            font-size: 13px;
        }

        .status::before {
            content: "○";
            font-size: 11px;
        }

        .status[data-state="live"]::before { content: "●"; }

        .tiles {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }

        .card {
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            padding: 16px;
        }

        .tile-label, .legend-item {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .swatch {
            width: 12px;
            height: 12px;
            border-radius: 3px;
            background: var(--swatch);
        }

        .tile-value {
            margin-top: 4px;
            font-size: 36px;
            font-weight: 650;
            line-height: 1.1;
            font-variant-numeric: tabular-nums;
        }

        .chart-head {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px 16px;
            margin-bottom: 12px;
        }

        .legend { display: flex; gap: 16px; }

        canvas {
            display: block;
            width: 100%;
            height: 340px;
        }

        details { margin-top: 16px; }
        summary { cursor: pointer; font-size: 14px; color: var(--text-secondary); }

        table {
            width: 100%;
            margin-top: 8px;
            border-collapse: collapse;
            font-size: 14px;
            font-variant-numeric: tabular-nums;
        }

        th, td {
            padding: 6px 8px;
            border-bottom: 1px solid var(--border);
            text-align: right;
        }

        th:first-child, td:first-child { text-align: left; }
        th { color: var(--text-secondary); font-weight: 600; }

        footer {
            margin-top: 20px;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .smoothie-chart-tooltip {
            z-index: 10;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--surface);
            color: var(--text-primary);
            font-size: 13px;
            box-shadow: 0 2px 8px rgb(0 0 0 / 18%);
        }

        @media (max-width: 480px) {
            .tiles { gap: 8px; }
            .tile-value { font-size: 30px; }
            canvas { height: 260px; }
        }
    </style>
</head>
<body>
<main>
    <header>
        <div>
            <h1>Analytics temps réel</h1>
            <p>Visites par page dans la fenêtre Kafka Streams de 5 secondes</p>
        </div>
        <span class="status" id="status" role="status" data-state="waiting">Connexion…</span>
    </header>

    <section class="tiles" aria-label="Visites dans la fenêtre courante">
        <div class="card">
            <span class="tile-label"><span class="swatch" style="--swatch: var(--series-1)"></span>Page P1</span>
            <div class="tile-value" id="value-P1">–</div>
        </div>
        <div class="card">
            <span class="tile-label"><span class="swatch" style="--swatch: var(--series-2)"></span>Page P2</span>
            <div class="tile-value" id="value-P2">–</div>
        </div>
    </section>

    <section class="card">
        <div class="chart-head">
            <h2>Évolution du nombre de visites</h2>
            <div class="legend" aria-hidden="true">
                <span class="legend-item"><span class="swatch" style="--swatch: var(--series-1)"></span>P1</span>
                <span class="legend-item"><span class="swatch" style="--swatch: var(--series-2)"></span>P2</span>
            </div>
        </div>
        <canvas id="chart" role="img" aria-label="Courbes temps réel du nombre de visites des pages P1 et P2"></canvas>
        <details>
            <summary>Afficher les dernières mesures</summary>
            <table>
                <thead>
                <tr><th scope="col">Heure</th><th scope="col">P1</th><th scope="col">P2</th></tr>
                </thead>
                <tbody id="measures"></tbody>
            </table>
        </details>
    </section>

    <footer>Marouane Mounir · ENSET Mohammedia · Systèmes Distribués et DevOps 2026</footer>
</main>

<script>
    const PAGES = [
        { id: "P1", color: "--series-1" },
        { id: "P2", color: "--series-2" }
    ];
    const MAX_MEASURES = 8;

    const statusEl = document.getElementById("status");
    const measuresEl = document.getElementById("measures");
    const seriesNames = new Map();
    let hasReceivedData = false;

    const chart = new SmoothieChart({
        responsive: true,
        millisPerPixel: 40,
        minValue: 0,
        maxValueScale: 1.15,
        interpolation: "linear",
        tooltip: true,
        tooltipLine: { lineWidth: 1, strokeStyle: "#8a8983" },
        tooltipFormatter: (timestamp, data) => {
            const time = new Date(timestamp).toLocaleTimeString("fr-FR");
            const rows = data.map(point =>
                `<div>${seriesNames.get(point.series)} : <strong>${Math.round(point.value)}</strong></div>`);
            return `<div>${time}</div>${rows.join("")}`;
        },
        grid: { millisPerLine: 5000, verticalSections: 4, borderVisible: false, lineWidth: 1 },
        labels: { fontSize: 12, precision: 0 }
    });

    PAGES.forEach(page => {
        page.series = new TimeSeries();
        seriesNames.set(page.series, page.id);
        chart.addTimeSeries(page.series, { lineWidth: 2, strokeStyle: "#000" });
    });

    function applyTheme() {
        const styles = getComputedStyle(document.documentElement);
        const token = name => styles.getPropertyValue(name).trim();
        chart.options.grid.fillStyle = token("--surface");
        chart.options.grid.strokeStyle = token("--grid");
        chart.options.labels.fillStyle = token("--text-secondary");
        PAGES.forEach(page => {
            chart.getTimeSeriesOptions(page.series).strokeStyle = token(page.color);
        });
    }

    function setStatus(state, text) {
        statusEl.dataset.state = state;
        statusEl.textContent = text;
    }

    function addMeasure(timestamp, values) {
        const row = document.createElement("tr");
        [new Date(timestamp).toLocaleTimeString("fr-FR"), ...values].forEach(value => {
            const cell = document.createElement("td");
            cell.textContent = value;
            row.appendChild(cell);
        });
        measuresEl.prepend(row);
        while (measuresEl.children.length > MAX_MEASURES) {
            measuresEl.lastElementChild.remove();
        }
    }

    function render(counts) {
        if (Object.keys(counts).length > 0) {
            hasReceivedData = true;
        }
        if (!hasReceivedData) {
            setStatus("waiting", "Initialisation de Kafka Streams…");
            return;
        }
        setStatus("live", "En direct");

        const now = Date.now();
        const values = PAGES.map(page => {
            const value = counts[page.id] ?? 0;
            page.series.append(now, value);
            document.getElementById(`value-${page.id}`).textContent = value;
            return value;
        });
        addMeasure(now, values);
    }

    applyTheme();
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
    new MutationObserver(applyTheme).observe(document.documentElement, {
        attributes: true,
        attributeFilter: ["data-theme"]
    });
    chart.streamTo(document.getElementById("chart"), 1000);

    const source = new EventSource("/analytics");
    source.onmessage = event => render(JSON.parse(event.data));
    source.onerror = () => setStatus("waiting", "Reconnexion…");
</script>
</body>
</html>
