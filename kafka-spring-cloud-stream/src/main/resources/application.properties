spring.application.name=kafka-spring-cloud-stream
server.port=8080
spring.cloud.stream.kafka.binder.brokers=localhost:9092
spring.cloud.stream.kafka.streams.binder.brokers=localhost:9092

spring.cloud.function.definition=pageEventConsumer;pageEventSupplier

# Consumer : T2
spring.cloud.stream.bindings.pageEventConsumer-in-0.destination=T2
spring.cloud.stream.bindings.pageEventConsumer-in-0.group=page-event-consumers

# Supplier : T3, un événement toutes les 200 ms
spring.cloud.stream.bindings.pageEventSupplier-out-0.destination=T3
spring.cloud.stream.bindings.pageEventSupplier-out-0.producer.poller.fixed-delay=200
